<!-- buy.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Buy Product</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container text-center mt-5">
    <h2>You Are Buying</h2>
    <img id="buyImage" class="img-fluid rounded shadow mt-3" width="250" alt="Product Image">
    <h3 id="buyName" class="mt-3"></h3>
    <p id="buyPrice" class="lead"></p>
  </div>

  <script>
    document.getElementById("buyImage").src = localStorage.getItem("buyImage");
    document.getElementById("buyName").innerText = localStorage.getItem("buyName");
    document.getElementById("buyPrice").innerText = localStorage.getItem("buyPrice");
  </script>
</body>
</html>

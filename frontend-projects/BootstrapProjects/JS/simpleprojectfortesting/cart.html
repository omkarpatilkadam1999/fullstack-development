<!-- cart.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Your Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container text-center mt-5">
    <h2>Item in Your Cart</h2>
    <img id="cartImage" class="img-fluid rounded shadow mt-3" width="250" alt="Cart Product">
    <h3 id="cartName" class="mt-3"></h3>
    <p id="cartPrice" class="lead"></p>
  </div>

  <script>
    document.getElementById("cartImage").src = localStorage.getItem("cartImage");
    document.getElementById("cartName").innerText = localStorage.getItem("cartName");
    document.getElementById("cartPrice").innerText = localStorage.getItem("cartPrice");
  </script>
</body>
</html>

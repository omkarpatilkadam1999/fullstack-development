<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>ShopKart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="indexstyle.css">
</head>
<body>

  <div class="container mt-5">
    <h1 class="text-center mb-4">Welcome to ShopKart</h1>
    
    <div class="row">
      <!-- Product Card -->
      <div class="col-md-4">
        <div class="card">
          <img src="/images/tshirt3.jpg" class="card-img-top" alt="T-Shirt">
          <div class="card-body text-center">
            <h5 class="card-title">Cool T-Shirt</h5>
            <p class="card-text">Price: ₹499</p>
            <button class="btn btn-success me-2" onclick="buyNow('/images/tshirt3.jpg', 'Cool T-Shirt', '₹499')">Buy</button>
            <button class="btn btn-primary" onclick="addToCart('/images/tshirt3.jpg', 'Cool T-Shirt', '₹499')">Add to Cart</button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <img src="/images/tshirt2.jpg" class="card-img-top" alt="T-Shirt">
          <div class="card-body text-center">
            <h5 class="card-title">Cool T-Shirt</h5>
            <p class="card-text">Price: ₹499</p>
            <button class="btn btn-success me-2" onclick="buyNow('/images/tshirt2.jpg', 'Cool T-Shirt', '₹499')">Buy</button>
            <button class="btn btn-primary" onclick="addToCart('/images/tshirt2.jpg', 'Cool T-Shirt', '₹499')">Add to Cart</button>
          </div>
        </div>
      </div>
      <!-- Add more product cards here -->
    </div>
  </div>

  <script src="indexjs.js"></script>
</body>
</html>
